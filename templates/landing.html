<!DOCTYPE html>
<html>

<head>
<title>BingeBuddy</title>

<style>

/* ===== FULLSCREEN GALAXY BACKGROUND ===== */

body{
margin:0;
height:100vh;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

font-family:'Segoe UI', sans-serif;

background:linear-gradient(-45deg,
#020024,
#090979,
#00d4ff,
#1a2a6c,
#3b0a45
);

background-size:400% 400%;
animation:gradientShift 18s ease infinite;

color:white;
overflow:hidden;
}

/* animated gradient movement */

@keyframes gradientShift{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}


/* ===== STARFIELD EFFECT ===== */

.stars{
position:absolute;
width:100%;
height:100%;

background:url("https://www.transparenttextures.com/patterns/stardust.png");

opacity:.35;
animation:moveStars 120s linear infinite;

z-index:-1;
}

@keyframes moveStars{
from{background-position:0 0;}
to{background-position:12000px 8000px;}
}


/* ===== MAIN HERO CONTENT ===== */

.hero{
text-align:center;
max-width:900px;
padding:40px;

animation:fadeIn 2s ease;
}


/* entrance animation */

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(40px);
}

to{
opacity:1;
transform:translateY(0);
}
}


/* ===== MAIN TITLE ===== */

h1{
font-size:4.5rem;
margin-bottom:10px;
letter-spacing:2px;
font-family: cursive;

color:#ab0112;

text-shadow:0px 0px 40px rgba(255,75,92,.6);
}


/* ===== SUBTITLE ===== */

.subtitle{
font-size:1.5rem;
opacity:.9;
margin-bottom:40px;
min-height:40px;
}


/* ===== CTA BUTTON ===== */

.start-btn{

padding:18px 60px;
font-size:22px;

border:none;
border-radius:50px;

background:#ff4b5c;
color:white;

cursor:pointer;

transition:.3s;

box-shadow:0px 0px 25px #ff4b5c;
}

.start-btn:hover{

transform:scale(1.12);

box-shadow:0px 0px 60px #ff4b5c;

background:#ff1e38;
}


/* ===== TAGLINE ===== */

.tagline{
margin-top:35px;
font-size:16px;
opacity:.6;
letter-spacing:1px;
}

</style>

</head>


<body>

<div class="stars"></div>

<div class="hero">

<h1>BingeBuddy 🎬</h1>

<div id="typing-text" class="subtitle"></div>

<a href="/step1/">
<button class="start-btn">
Start the vibe test 🚀
</button>
</a>

<div class="tagline">
Tell us your mood. We'll pick your movie.
</div>

</div>


<script>

/* cinematic typing animation */

const text = "Discover movies that match your exact vibe — instantly.";

let i = 0;

function typing(){

if(i < text.length){

document.getElementById("typing-text").innerHTML += text.charAt(i);

i++;

setTimeout(typing,35);

}

}

typing();

</script>


</body>
</html>
