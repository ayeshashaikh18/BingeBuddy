{% load static %}

<!DOCTYPE html>
<html>

<head>
<title>Your BingeBuddy Picks</title>

<style>

/* ===== BACKGROUND MATCHES STEP PAGES ===== */

body{

margin:0;
font-family:'Segoe UI', sans-serif;
color:white;

background:
radial-gradient(circle at 20% 30%, #ff4b5c33 0%, transparent 40%),
radial-gradient(circle at 80% 70%, #7f00ff33 0%, transparent 45%),
linear-gradient(135deg,#020024,#090979,#1a2a6c);

background-size:200% 200%;

animation:vibeMove 12s ease infinite;

overflow-x:hidden;

}

/* animated background movement */

@keyframes vibeMove{

0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}

}


/* ===== STARFIELD LAYER ===== */

.stars{

position:fixed;

width:100%;
height:100%;

background:url("https://www.transparenttextures.com/patterns/stardust.png");

opacity:.35;

animation:starDrift 80s linear infinite;

z-index:-1;

}

@keyframes starDrift{

from{background-position:0 0;}
to{background-position:10000px 6000px;}

}


/* ===== HEADER ===== */

h1{

text-align:center;

margin-top:40px;

font-size:3.2rem;

letter-spacing:1px;

color:#ff4b5c;

text-shadow:0px 0px 40px rgba(255,75,92,.6);

animation:titleGlow 3s infinite alternate;

}

@keyframes titleGlow{

from{filter:drop-shadow(0 0 10px #ff4b5c);}
to{filter:drop-shadow(0 0 35px #ff4b5c);}

}


.subtitle{

text-align:center;

margin-top:10px;

opacity:.75;

font-size:1.2rem;

}


/* ===== MOVIE GRID ===== */

.movies-container{

display:flex;

justify-content:center;

gap:45px;

flex-wrap:wrap;

margin-top:60px;

padding-bottom:60px;

}


/* ===== MOVIE CARD ===== */

.movie-card{

width:260px;

background:rgba(255,255,255,0.06);

border-radius:20px;

overflow:hidden;

backdrop-filter:blur(20px);

transition:.45s;

box-shadow:
0px 10px 40px rgba(0,0,0,.6),
0px 0px 25px rgba(127,0,255,.25);

animation:fadeUp .8s ease forwards;

opacity:0;

}

/* stagger animation */

.movie-card:nth-child(1){animation-delay:.2s;}
.movie-card:nth-child(2){animation-delay:.5s;}
.movie-card:nth-child(3){animation-delay:.8s;}

@keyframes fadeUp{

from{
opacity:0;
transform:translateY(50px);
}

to{
opacity:1;
transform:translateY(0);
}

}


/* hover glow matches step-page theme */

.movie-card:hover{

transform:scale(1.08);

box-shadow:
0px 25px 70px rgba(0,0,0,.9),
0px 0px 45px rgba(255,75,92,.55);

}


/* poster image */

.movie-card img{

width:100%;
height:360px;

object-fit:cover;

transition:.4s;

}

.movie-card:hover img{

transform:scale(1.05);

}


/* ===== MOVIE INFO ===== */

.movie-info{

padding:18px;

}

.movie-info h2{

margin:10px 0;

font-size:1.4rem;

}


/* genre label */

.genre{

opacity:.7;

font-size:.9rem;

}


/* rating label */

.rating{

color:#ffd700;

font-weight:bold;

margin-top:5px;

}


/* match score badge */

.match-score{

margin-top:8px;

display:inline-block;

padding:5px 12px;

border-radius:20px;

background:linear-gradient(90deg,#ff4b5c,#7f00ff);

font-size:14px;

}


/* ===== BUTTON ===== */

.retry-section{

text-align:center;

margin-bottom:60px;

}

.retry-btn{

padding:15px 45px;

font-size:18px;

border:none;

border-radius:40px;

background:#ff4b5c;

color:white;

cursor:pointer;

transition:.3s;

box-shadow:0 0 20px rgba(255,75,92,.6);

}

.retry-btn:hover{

transform:scale(1.1);

background:#ff1e38;

box-shadow:0 0 45px rgba(255,75,92,1);

}

</style>

</head>


<body>

<div class="stars"></div>

<h1>Your BingeBuddy Picks 🍿</h1>

<div class="subtitle">

Matched perfectly with your vibe

</div>


<div class="movies-container">

{% for movie in movies %}

<div class="movie-card">

<img src="/{{ movie.poster_local }}">

<div class="movie-info">

<h2>{{ movie.title }}</h2>

<div class="genre">{{ movie.genre }}</div>

<div class="rating">⭐ {{ movie.rating }}</div>

<div class="match-score">

Match Score: {{ movie.match_score }}/5

</div>

</div>

</div>

{% endfor %}

</div>


<div class="retry-section">

<a href="/">

<button class="retry-btn">

Try another vibe

</button>

</a>

</div>


</body>

</html>
